name: Smoke Tests

on:
  schedule:
    - cron: '0 7 * * *'  # 7am UTC daily
  workflow_dispatch:       # allow manual trigger from GitHub UI
    inputs:
      pytest_markers:
        description: >-
          Optional pytest -m expression (e.g. "auth or jobs or tutors") to run
          just a subset of tests -- see pytest.ini for the full marker list.
          Leave blank for the normal full-suite run. Non-blank runs skip the
          results-branch push and critical-regression-alert steps below, so a
          quick targeted check never corrupts the live dashboard or fires a
          false regression alert for tests that simply didn't run this time.
        required: false
        default: ''

jobs:
  smoke-tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Diagnostic only, added 5 Sept 2026 to test the "shared/overlapping
      # runner IP" theory behind the otdev1602 403s -- see docs/TO_DO.md.
      # Logs this runner's public egress IP so it can be compared against the
      # IP logged by the equivalent step in deploy-staging.yml. Remove once
      # the 403 investigation is closed.
      - name: Log runner public IP
        run: curl -s https://api.ipify.org

      # Diagnostic only, added 5 Sept 2026 -- WP Engine support found no 403s
      # in their server-level access/error logs and asked us to confirm the
      # 403 directly and show it replicated outside our test framework. This
      # replays the exact same request pytest_sessionstart makes (same URL,
      # same POST body, same Basic Auth) via a bare curl, with no Python,
      # requests library, or Playwright involved, and prints the raw response
      # status line, headers, and body for WP Engine to inspect. Only
      # response headers are printed (never -v/request headers), so Basic
      # Auth / the API key are never echoed into the log.
      #
      # Extended 7 Sept 2026: the first run of this step got a clean 200, but
      # the very next step (the Python-based fixture script, same runner,
      # same IP, ~28s later) still got its usual instant 403 -- ruling out
      # the IP itself and pointing straight at something about the request
      # signature. The one concrete difference between curl and Python's
      # `requests` library is the default User-Agent header
      # (`python-requests/2.31.0` vs `curl/x.y.z`). This now fires the same
      # request 3 times with different User-Agent strings, from the same IP,
      # seconds apart, to see whether that header alone is what's being
      # blocked. Remove this whole step once the 403 investigation is closed.
      - name: Diagnostic - raw curl replication for WP Engine
        continue-on-error: true
        timeout-minutes: 1
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          OWL_TEST_API_KEY: ${{ secrets.OWL_TEST_API_KEY }}
          TEST_HTTP_USER: ${{ secrets.TEST_HTTP_USER }}
          TEST_HTTP_PASS: ${{ secrets.TEST_HTTP_PASS }}
        run: |
          try_ua () {
            LABEL="$1"
            UA="$2"
            STATUS=$(curl -s -o response_body.txt -D response_headers.txt -w "%{http_code}" \
              --max-time 15 \
              -X POST \
              -A "$UA" \
              -u "$TEST_HTTP_USER:$TEST_HTTP_PASS" \
              -d "action=owl_set_test_mode" \
              -d "api_key=$OWL_TEST_API_KEY" \
              "$TEST_BASE_URL/wp-admin/admin-ajax.php")
            echo "=== $LABEL (User-Agent: $UA) -> HTTP $STATUS ==="
            cat response_headers.txt
            echo "body: $(cat response_body.txt)"
            echo ""
          }

          try_ua "default curl UA"      "curl/8.5.0"
          try_ua "python-requests UA"   "python-requests/2.31.0"
          try_ua "real browser UA"      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # Repairs the client/tutor test fixture accounts on staging before each
      # run -- otdev1602 carries a full production data sync, and per
      # docs/TESTING_REBUILD_SPEC.md §3.2 these fixture accounts are
      # deliberately kept OFF production, so every sync wipes them from
      # staging too (owl_system/docs/TESTING_SYSTEM.md's SSH/staging fixture
      # automation section). continue-on-error: if this step fails, the
      # actual test run below still gets a chance to run rather than the
      # whole workflow aborting on a repair step.
      #
      # Switched from SSH (recreate_staging_fixtures.sh) to a plain AJAX call
      # (recreate_staging_fixtures.py -> owl_repair_test_fixtures in
      # owl_system) on 5 Sept 2026. History: this step originally made ~7
      # fresh SSH connections per run; WP Engine support confirmed that burst
      # trips their automated brute-force protection, instantly blocking the
      # runner's IP before WordPress even loads -- which then also blocked
      # the "Run tests" step's first HTTP request below. Two mitigations
      # (a connection delay, then consolidating to 2 SSH connections) both
      # failed a genuinely clean test (18h44m gap, 5 Sept). This change
      # removes SSH from the pipeline entirely, to test whether that was the
      # complete explanation. If runs still 403 with zero SSH connections and
      # a clean gap, that's strong evidence something else is the real cause
      # -- see docs/TO_DO.md for the full history and what happens next
      # either way. The old SSH script is left in the repo, unused by CI, for
      # manual debugging.
      - name: Recreate staging test fixtures
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          OWL_TEST_API_KEY: ${{ secrets.OWL_TEST_API_KEY }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
          TEST_TUTOR_EMAIL: ${{ secrets.TEST_TUTOR_EMAIL }}
          TEST_TUTOR_PASSWORD: ${{ secrets.TEST_TUTOR_PASSWORD }}
          TEST_MEET_NOW_TUTOR_ID: ${{ secrets.TEST_MEET_NOW_TUTOR_ID }}
          TEST_HTTP_USER: ${{ secrets.TEST_HTTP_USER }}
          TEST_HTTP_PASS: ${{ secrets.TEST_HTTP_PASS }}
        run: python scripts/recreate_staging_fixtures.py

      # Cooldown kept even with SSH removed, to change only one variable at
      # a time in this experiment -- if runs stop 403'ing, worth revisiting
      # whether this is still needed at all.
      - name: Cooldown before test run
        run: sleep 90

      - name: Run tests
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
          OWL_TEST_API_KEY: ${{ secrets.OWL_TEST_API_KEY }}
          TEST_TUTOR_IDS: ${{ secrets.TEST_TUTOR_IDS }}
          TEST_MEET_NOW_TUTOR_ID: ${{ secrets.TEST_MEET_NOW_TUTOR_ID }}
          TEST_TUTOR_EMAIL: ${{ secrets.TEST_TUTOR_EMAIL }}
          TEST_TUTOR_PASSWORD: ${{ secrets.TEST_TUTOR_PASSWORD }}
          TEST_PREAPPLICANT_EMAIL: ${{ secrets.TEST_PREAPPLICANT_EMAIL }}
          TEST_PREAPPLICANT_PASSWORD: ${{ secrets.TEST_PREAPPLICANT_PASSWORD }}
          TEST_HTTP_USER: ${{ secrets.TEST_HTTP_USER }}
          TEST_HTTP_PASS: ${{ secrets.TEST_HTTP_PASS }}
          PYTEST_MARKERS: ${{ github.event.inputs.pytest_markers }}
        # --video=on records every test; utils/prune_videos.py below then
        # deletes anything that doesn't earn a place per
        # docs/TESTING_REBUILD_SPEC.md Day 8 (critical tests always, everything
        # else only on failure) rather than varying --video per test, which
        # pytest-playwright doesn't support.
        run: |
          if [ -n "$PYTEST_MARKERS" ]; then
            echo "Targeted run -- pytest -m \"$PYTEST_MARKERS\""
            pytest -m "$PYTEST_MARKERS" --video=on --output=test-results --json-report --json-report-file=pytest-report.json -v
          else
            pytest --video=on --output=test-results --json-report --json-report-file=pytest-report.json -v
          fi
        continue-on-error: true

      - name: Prune non-critical passing videos
        run: python utils/prune_videos.py pytest-report.json test-results

      - name: Write results.json
        run: python utils/reporter.py pytest-report.json

      - name: Check for critical state changes and alert
        if: github.event.inputs.pytest_markers == ''
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          OWL_TEST_API_KEY: ${{ secrets.OWL_TEST_API_KEY }}
          TEST_HTTP_USER: ${{ secrets.TEST_HTTP_USER }}
          TEST_HTTP_PASS: ${{ secrets.TEST_HTTP_PASS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin
          git show origin/results:results.json > previous_results.json 2>/dev/null || echo '{}' > previous_results.json
          python utils/check_critical_regressions.py previous_results.json results.json pytest-report.json

      - name: Push results to results branch
        if: github.event.inputs.pytest_markers == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Set up results branch as a worktree so we never touch main
          git fetch origin
          if git ls-remote --exit-code origin results; then
            git worktree add /tmp/results origin/results
          else
            git worktree add --orphan -b results /tmp/results
          fi

          cp results.json /tmp/results/

          # Copy details.json if written by tests
          if [ -f "$GITHUB_WORKSPACE/details.json" ]; then
            cp details.json /tmp/results/
          fi

          # Copy any screenshots captured during the run
          if [ -d "$GITHUB_WORKSPACE/screenshots" ]; then
            mkdir -p /tmp/results/screenshots
            cp "$GITHUB_WORKSPACE/screenshots/"*.png /tmp/results/screenshots/ 2>/dev/null || true
          fi

          cd /tmp/results
          git add results.json details.json screenshots/
          git diff --staged --quiet || git commit -m "Test results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:results

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/**/*.webm
          # Day 8's storage decision (docs/TESTING_REBUILD_SPEC.md): GitHub
          # Actions artifacts with expiry, not committed to the results branch
          # — avoids the repo-bloat risk of committing video the way
          # screenshots are today. Each day's run is its own artifact, so
          # there's no accumulating path to prune — the previous day's videos
          # simply expire.
          retention-days: 14
          if-no-files-found: ignore
